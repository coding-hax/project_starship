name: Guards

# Split out of ci.yml (#164): these jobs read the PR label `tests-exempt` and
# must re-run on labeled/unlabeled so a label tap re-checks
# them — but that trigger used to drag the whole CI file along with it, costing
# ~11 minutes of e2e/quality for a label change that touched no code. Job names
# stay unchanged; branch protection matches on job name, not workflow file.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  # --- Guard: no weakened tests --------------------------------------------
  test-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: git fetch origin main
      - name: Run test-integrity guard
        run: |
          EXEMPT=""
          if echo '${{ toJson(github.event.pull_request.labels.*.name) }}' | grep -q 'tests-exempt'; then
            EXEMPT=1
          fi
          bash scripts/check-test-integrity.sh origin/main "$EXEMPT"

  # --- Advisory: which sensitive paths does this PR touch? ------------------
  # This used to BLOCK until a human set 'human-approved'. It no longer does
  # (#276): the PRs are approved directly anyway, so the label bought no extra
  # pair of eyes -- only an extra handle that regularly became the actual
  # bottleneck (label on the PR instead of the issue, two check suites racing,
  # tickets idle for a day).
  #
  # The accepted price, stated plainly: an unattended runner can now merge a
  # migration, a crypto change or a sync fix on its own. The remaining nets are
  # schema-drift, quality (sync invariants), test-integrity, e2e-offline and
  # the db-migration review role.
  protected-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Report which sensitive paths are touched
        run: |
          git fetch origin main
          TOUCHED=$(git diff --name-only origin/main...HEAD \
            -- 'src/db/**' 'src/crypto/**' 'src/local/**' 'src/app/api/sync/**' \
               'src/auth/**' 'src/app/api/auth/**' 'src/**/auth*' \
               '.github/**' 'scripts/**')

          if [ -z "$TOUCHED" ]; then
            echo "✓ No sensitive paths touched."
            exit 0
          fi

          echo "ℹ This PR touches sensitive paths:"
          echo "$TOUCHED"
          echo ""
          echo "  Advisory only — this check never blocks the merge (#276)."
