name: Guards

# Split out of ci.yml (#164): these jobs read the PR label `tests-exempt` and
# must re-run on labeled/unlabeled so a label tap re-checks
# them — but that trigger used to drag the whole CI file along with it, costing
# ~11 minutes of e2e/quality for a label change that touched no code. Job names
# stay unchanged; branch protection matches on job name, not workflow file.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

# What used to live here besides test-integrity: a 'protected-paths' job that
# listed which sensitive paths a PR touched. It blocked until a human set
# 'human-approved' (removed in #276), then it only reported, then it was
# removed entirely (#283) -- a check that never fails teaches nobody anything,
# and it was still a required check occupying a runner on every PR. The nets
# that remain are schema-drift, quality (sync invariants), test-integrity,
# e2e-offline and the db-migration review role.

jobs:
  # --- Guard: no weakened tests --------------------------------------------
  test-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: git fetch origin main
      - name: Run test-integrity guard
        run: |
          EXEMPT=""
          if echo '${{ toJson(github.event.pull_request.labels.*.name) }}' | grep -q 'tests-exempt'; then
            EXEMPT=1
          fi
          bash scripts/check-test-integrity.sh origin/main "$EXEMPT"
